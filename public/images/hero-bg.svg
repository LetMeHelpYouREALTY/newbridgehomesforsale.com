<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Las Vegas homes hero background</title>
  <desc id="desc">Decorative skyline style background used for New Bridge Homes hero sections.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#17384a" />
      <stop offset="100%" stop-color="#2a5f7a" />
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)" />
  <g fill="#ffffff" opacity="0.18">
    <circle cx="1320" cy="160" r="90" />
    <rect x="180" y="500" width="220" height="260" rx="8" />
    <rect x="430" y="430" width="270" height="330" rx="8" />
    <rect x="730" y="360" width="180" height="400" rx="8" />
    <rect x="940" y="470" width="260" height="290" rx="8" />
    <rect x="1230" y="410" width="170" height="350" rx="8" />
  </g>
  <text x="800" y="810" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" fill="#ffffff" opacity="0.92">
    New Bridge Homes | Las Vegas
  </text>
</svg>
